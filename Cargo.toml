[package]
name = "sentinel-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
fred = { version = "9.0", features = ["subscriber-client"] }
tokio-util = "0.7"
axum = "0.8.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
